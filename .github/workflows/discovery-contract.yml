name: Discovery scientific contract

on:
  pull_request:
    paths:
      - "rsi_researcher/research/discovery/**"
      - "tests/test_discovery_science_contract.py"
      - "tests/test_discovery_research_handoff.py"
      - "tests/test_discovery_active_experiments.py"
      - "tests/test_discovery_variable_lineage.py"
      - "tests/test_discovery_dataset_reference.py"
      - "tests/test_discovery_opportunity_frontier.py"
      - "tests/test_discovery_controlled_reference.py"
      - "tests/test_discovery_review.py"
      - "tests/test_open_research.py"
      - ".github/workflows/discovery-contract.yml"
  push:
    branches:
      - "feat/discovery-science-contract-20261028"
      - "feat/discovery-reference-adapters-20261028"
      - "feat/discovery-opportunity-frontier-20261028"
      - "feat/discovery-controlled-reference-20261028"

jobs:
  scientific-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install targeted test dependencies
        run: python -m pip install -e . 'duckdb>=1.3,<2' pytest
      - name: Compile changed Python sources
        run: python -m compileall -q rsi_researcher/research/discovery tests/test_discovery_science_contract.py
      - name: Test discovery execution and scientific state
        run: python -m pytest -q tests/test_discovery_variable_lineage.py tests/test_discovery_active_experiments.py tests/test_discovery_research_handoff.py tests/test_discovery_controlled_reference.py tests/test_discovery_opportunity_frontier.py tests/test_discovery_dataset_reference.py tests/test_discovery_science_contract.py tests/test_discovery_review.py tests/test_discovery_native_intent.py tests/test_discovery_compact_agent_route.py tests/test_open_research.py
